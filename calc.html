<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stat Hesaplayıcı</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>try{var t=localStorage.getItem("ivcalc.theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="stylesheet" href="style.css">
<style>
.calc [hidden]{display:none!important}
.calc{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.calc input:not([type=checkbox]),.calc select{background:var(--field);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font:inherit;font-size:.9rem;max-width:100%}
.calc button.mini{padding:5px 8px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.row label{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#mon{width:280px}
.combo{position:relative}
#monList{position:absolute;z-index:5;top:100%;right:0;width:280px;max-width:100%;max-height:320px;overflow-y:auto;background:var(--field);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}
#monList div{padding:6px 10px;cursor:pointer;text-align:left}
#monList div:hover,#monList div.cur{background:var(--panel2)}
.hero,.hero .row{flex-direction:row;justify-content:center}
.hero{flex-direction:column}
#sprite{width:min(280px,100%);height:280px;object-fit:contain;image-rendering:pixelated}
.tblwrap{overflow-x:auto;margin-top:10px}
.calc table{width:100%;border-collapse:collapse;white-space:nowrap}
.calc th,.calc td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--hair)}
.calc td:first-child{text-align:left;font-weight:700}
.calc td input{width:64px;text-align:center;-moz-appearance:textfield;appearance:textfield}
.calc td input::-webkit-inner-spin-button,.calc td input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.calc .final{font-size:1.25rem;font-weight:700}
#saves{list-style:none}
#saves li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair)}
#saves li span{flex:1;min-width:0;overflow-wrap:anywhere}
.up{color:var(--good)}.down{color:var(--bad)}
</style>
</head>
<body>
<main class="calc">
  <div class="panel row hero">
    <img id="sprite" alt="">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0">
      <div class="combo"><label>Pokémon <input id="mon" autocomplete="off" placeholder="Ad veya numara yaz…" role="combobox" aria-controls="monList" aria-expanded="false"></label>
      <div id="monList" role="listbox" hidden></div></div>
      <div class="row" id="types"></div>
      <div class="row">
        <label>Seviye <input id="level" type="number" min="1" max="100" value="100" style="width:76px"></label>
        <label>Nature <select id="nature"></select></label>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="row"><label>Ability <select id="ability"></select></label><label id="abOnL"><input type="checkbox" id="abOn"> <span id="abTxt"></span></label></div>
    <p class="shothint" id="abDesc"></p>
    <div class="row" style="margin-top:10px"><label>Eşya <select id="item"></select></label><label id="itOnL"><input type="checkbox" id="itOn"> <span id="itTxt"></span></label></div>
  </div>
  <div class="panel">
    <div class="row">
      <button class="mini" data-all="iv" data-v="31">IV hepsi 31</button><button class="mini" data-all="iv" data-v="0">IV sıfırla</button>
      <button class="mini" data-all="ev" data-v="85">EV eşit dağıt (85)</button><button class="mini" data-all="ev" data-v="0">EV sıfırla</button>
      <span id="evTotal"></span>
    </div>
    <div class="tblwrap"><table>
      <thead><tr><th></th><th>Base</th><th>IV</th><th>EV</th><th>Kademe (−6…+6)</th><th>Sonuç</th></tr></thead>
      <tbody id="stats"></tbody>
    </table></div>
    <div class="row" style="margin-top:10px"><b>Tüm kademeler:</b> <span id="allStage"></span></div>
  </div>
  <div class="panel">
    <div class="row"><input id="saveName" maxlength="80" placeholder="Kayıt adı (boşsa Pokémon adı)" aria-label="Kayıt adı" style="width:260px"><button class="mini" id="save">💾 Kaydet</button>
      <button class="mini" id="export">⬇ JSON yedeği indir</button><button class="mini" id="import">⬆ JSON'dan yükle</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
    <p class="shothint" id="saveMsg" role="status"></p>
    <ul id="saves"></ul>
  </div>
</main>
<script type="module" src="js/calc.js"></script>
</body>
</html>
