<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IV Calculator — Pokémon Inventory</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <!-- SOL: form -->
  <div class="panel">
    <h2>Add Pokémon</h2>
    <textarea id="paste" placeholder="Ör.&#10;Mankey&#10;Level: 22&#10;Adamant Nature&#10;Ability: Anger Point&#10;EVs: 0 HP / 0 Atk / 0 Def / 0 SpA / 0 SpD / 0 Spe&#10;IVs: 15 HP / 27 Atk / 4 Def / 29 SpA / 28 SpD / 11 Spe&#10;- Cross Chop&#10;- Swagger&#10;- Pursuit&#10;- Seismic Toss"></textarea>
    <div class="shotrow">
      <button class="mini" id="btnClip" title="Read the image currently in your clipboard (same as pressing Ctrl+V)">📋 Paste image from clipboard</button>
      <button class="mini" id="btnShot" title="Choose an image file">📷 Image file…</button>
    </div>
    <div class="shothint">Tip: copy a screenshot, then press <kbd>Ctrl</kbd>+<kbd>V</kbd> anywhere on this page. You can also drop an image on the text box.</div>
    <input type="file" id="shotFile" accept="image/*" hidden>
    <button class="btn-add" id="btnAdd">＋ Add to Inventory</button>
    <div class="msg" id="msg"></div>
    <div class="status" id="status"></div>
    <progress id="impbar" max="1" value="0" hidden></progress>
    <button class="mini" id="btnReload" title="Reload the newest version of the site (your inventory is kept)">↻ Update site</button>
  </div>

  <!-- SAĞ: envanter -->
  <div class="panel">
    <h2>Inventory (<span id="count">0</span>)
      <button class="danger" id="btnClear" title="Delete all Pokémon in the inventory">🗑 Clear All</button>
    </h2>
    <div class="toolbar">
      <div class="tb-group">
        <button class="mini" id="btnSelAll">Select all</button>
        <button class="mini" id="btnSelNone">Deselect all</button>
        <button class="mini" id="btnSelInv">Invert</button>
      </div>
      <div class="tb-group" id="bulk"></div>
    </div>
    <div class="totals" id="totals"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Boş alan -->
<div id="slotHolder" style="display:none">
  <div class="slot" id="emptySlot" data-slot><span class="plus">＋</span><span>Empty slot — click to add</span></div>
</div>

<!-- tooltip -->
<div class="tooltip" id="tooltip"></div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<!-- Kart şablonu -->
<template id="tpl-card">
  <div class="card">
    <button class="del" title="Delete">✕</button>
    <label class="sel" title="Select"><input type="checkbox"><span></span></label>
    <img class="sprite" width="88" height="88" alt="">
    <div class="name"></div>
    <div class="types"></div>
    <div class="tags"></div>
    <div class="lvl"></div>
    <div class="tiny-rows">
      <div class="tiny-row"><span>Ability</span><span class="tip ability"></span></div>
      <div class="tiny-row"><span>Total IV</span><span class="iv-sum"></span></div>
    </div>
    <div class="ivbadge" title="IV toplamı (max 186)"><span class="tv">0</span> <small>IV</small></div>
    <div class="ctrl"></div>
  </div>
</template>

<!-- Modal şablonu -->
<template id="tpl-modal">
  <button class="close" title="Kapat">✕</button>
  <div class="m-left">
    <div class="m-head">
      <img class="sprite" width="170" height="170" alt="">
      <div class="name"></div>
      <div class="types"></div>
      <div class="lvl"></div>
      <div class="lvl-extra" style="color:var(--muted);font-size:.85rem;margin-top:4px"></div>
      <div class="ctrl m-ctrl"></div>
    </div>
    <div class="m-total">
      <div class="lbl">Total IV <span class="tvsum"></span> / 186</div>
      <div class="big"><span class="tv">0</span></div>
      <div class="bar"><div class="tvbar"></div></div>
    </div>
    <div class="sec">Moves</div>
    <div class="statbox">
      <table class="movetable">
        <thead>
          <tr><th>Type</th><th>Cat.</th><th style="text-align:left">Move</th></tr>
        </thead>
        <tbody id="movesBody"></tbody>
      </table>
    </div>
  </div>
  <div class="m-right">
    <div class="sec secstats">Stats — Lv.100 · IV · EV</div>
    <div class="buffall" id="buffAll"></div>
    <div class="statbox">
      <table>
        <tr><th>Stat</th><th class="thlv">Lv.100</th><th>IV</th><th>EV</th><th>Buff</th></tr>
        <tbody id="statBody"></tbody>
      </table>
    </div>
    <div class="sec">Base Stats</div>
    <div class="statbox" style="opacity:.92">
      <table>
        <tr><th>Stat</th><th style="width:58%">Base</th></tr>
        <tbody id="baseBody"></tbody>
      </table>
    </div>
  </div>
  <div class="m-footer">
    <div class="footerline fAbility"><b>Ability:</b> <span class="fad">loading…</span></div>
    <div class="footerline fNature"><b>Nature:</b> <span class="fnd">loading…</span></div>
  </div>
</template>

<script type="module" src="js/main.js"></script>
</body>
</html>
