<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IV Calculator — Pokémon Envanteri</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <!-- SOL: form -->
  <div class="panel">
    <h2>Pokémon Ekle</h2>
    <textarea id="paste" placeholder="Ör.&#10;Mankey&#10;Level: 22&#10;Adamant Nature&#10;Ability: Anger Point&#10;EVs: 0 HP / 0 Atk / 0 Def / 0 SpA / 0 SpD / 0 Spe&#10;IVs: 15 HP / 27 Atk / 4 Def / 29 SpA / 28 SpD / 11 Spe&#10;- Cross Chop&#10;- Swagger&#10;- Pursuit&#10;- Seismic Toss"></textarea>
    <button class="btn-add" id="btnAdd">＋ Envantere Ekle</button>
    <div class="msg" id="msg"></div>
    <div class="status" id="status"></div>
  </div>

  <!-- SAĞ: envanter -->
  <div class="panel">
    <h2>Envanter (<span id="count">0</span>)
      <button class="danger" id="btnClear" title="Envanterdeki tüm Pokémon'ları sil">🗑 Tümünü Sil</button>
    </h2>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Boş alan -->
<div id="slotHolder" style="display:none">
  <div class="slot" id="emptySlot" data-slot><span class="plus">＋</span><span>Boş alan — eklemek için tıkla</span></div>
</div>

<!-- tooltip -->
<div class="tooltip" id="tooltip"></div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<!-- Kart şablonu -->
<template id="tpl-card">
  <div class="card">
    <button class="del" title="Sil">✕</button>
    <img class="sprite" width="88" height="88" alt="">
    <div class="name"></div>
    <div class="types"></div>
    <div class="lvl"></div>
    <div class="tiny-rows">
      <div class="tiny-row"><span>Ability</span><span class="tip ability"></span></div>
      <div class="tiny-row"><span>IV Toplam</span><span class="iv-sum"></span></div>
    </div>
    <div class="ivbadge" title="IV toplamı (max 186)"><span class="tv">0</span> <small>IV</small></div>
  </div>
</template>

<!-- Modal şablonu -->
<template id="tpl-modal">
  <button class="close" title="Kapat">✕</button>
  <div class="m-left">
    <div class="m-head">
      <img class="sprite" width="170" height="170" alt="">
      <div class="name"></div>
      <div class="lvl"></div>
      <div class="types"></div>
      <div class="lvl-extra" style="color:var(--muted);font-size:.85rem;margin-top:4px"></div>
    </div>
    <div class="m-total">
      <div class="lbl">Toplam IV <span class="tvsum"></span> / 186</div>
      <div class="big"><span class="tv">0</span></div>
      <div class="bar"><div class="tvbar"></div></div>
    </div>
    <div class="info-box"><div class="k">Ability</div><div class="v abl"></div></div>
    <div class="info-box" style="margin-top:8px"><div class="k">Nature</div><div class="v nat"></div></div>
    <div class="eff descAbility" style="margin-top:10px;text-align:left"></div>
    <div class="eff descNature" style="margin-top:8px;text-align:left"></div>
    <div class="sec">Hamleler</div>
    <div id="moves"></div>
  </div>
  <div class="m-right">
    <div class="sec">Stat Dağılımı — Lv.100 · IV · EV</div>
    <div class="statbox">
      <table>
        <tr><th>Stat</th><th>Lv.100</th><th>IV</th><th>EV</th></tr>
        <tbody id="statBody"></tbody>
      </table>
    </div>
    <div class="sec">Base Statlar</div>
    <div class="statbox" style="opacity:.92">
      <table>
        <tr><th>Stat</th><th style="width:58%">Base</th></tr>
        <tbody id="baseBody"></tbody>
      </table>
    </div>
  </div>
</template>

<script type="module" src="js/main.js"></script>
</body>
</html>
